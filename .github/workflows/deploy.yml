name: Laravel CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/laravel_docker_app:latest .

      # 4. Push Docker Image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/laravel_docker_app:latest

      # 5. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Go to project folder"
            cd /var/www/laravel-docker

            echo "Pull latest image"
            docker pull ${{ secrets.DOCKER_USERNAME }}/laravel_docker_app:latest

            echo "Stop old containers"
            docker compose down

            echo "Start containers"
            docker compose up -d

            echo "Wait for MySQL to be ready..."
            until docker exec laravel_docker_db mysqladmin ping -h "localhost" --silent; do
              sleep 2
            done

            echo "Run Laravel setup"
            docker exec laravel_docker_app php artisan migrate --force || true
            docker exec laravel_docker_app php artisan config:clear || true
            docker exec laravel_docker_app php artisan cache:clear || true
            docker exec laravel_docker_app php artisan route:clear || true
            docker exec laravel_docker_app php artisan view:clear || true

            echo "Restart services"
            docker compose restart

            echo "Deployment completed successfully"