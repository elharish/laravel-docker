name: Laravel CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/laravel_docker_app:latest
            ${{ secrets.DOCKER_USERNAME }}/laravel_docker_app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Setup SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with Rollback
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd /var/www/laravel-docker

            echo "Saving current image..."
            OLD_IMAGE=$(docker inspect laravel_docker_app --format='{{.Config.Image}}' || true)

            rollback() {
              echo "Deployment failed. Rolling back..."

              if [ -n "$OLD_IMAGE" ]; then
                docker compose down || true

                docker pull "$OLD_IMAGE"

                docker run -d \
                  --name laravel_docker_app \
                  --network laravel-docker \
                  "$OLD_IMAGE"

                docker run -d \
                  --name laravel_docker_nginx \
                  --network laravel-docker \
                  -p 8001:80 \
                  -v /var/www/laravel-docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro \
                  nginx:alpine

                echo "Rollback complete"
              else
                echo "No previous image found"
              fi

              exit 1
            }

            echo "Deploying new version..."
            docker compose pull || rollback
            docker compose up -d --remove-orphans || rollback

            echo "Running Laravel commands..."
            docker compose exec -T app php artisan migrate --force || rollback
            docker compose exec -T app php artisan optimize:clear || rollback
            docker compose exec -T app php artisan optimize || rollback

            echo "Waiting for app..."
            sleep 25

            echo "Running health check..."
            curl -f http://localhost:8001 || rollback

            echo "Deployment successful"

            echo "Cleaning old images..."
            docker image prune -f
          EOF