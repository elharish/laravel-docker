name: Laravel CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/laravel_docker_app:latest .

      - name: Push Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/laravel_docker_app:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/laravel-docker

            docker compose down
            docker pull ${{ secrets.DOCKER_USERNAME }}/laravel_docker_app:latest
            docker compose up -d

            echo "Waiting for DB..."
            sleep 25

            docker exec laravel_docker_app php artisan key:generate || true
            docker exec laravel_docker_app php artisan session:table || true
            docker exec laravel_docker_app php artisan migrate --force
            docker exec laravel_docker_app php artisan optimize:clear