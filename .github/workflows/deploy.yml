name: Laravel CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/laravel_docker_app:latest
            ${{ secrets.DOCKER_USERNAME }}/laravel_docker_app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Restore SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > private_key
          chmod 600 private_key

      - name: Deploy with Rollback
        run: |
          ssh -i private_key \
            -o StrictHostKeyChecking=no \
            ubuntu@${{ secrets.EC2_HOST }} << 'EOF'

            set -e
            cd /var/www/laravel-docker

            echo "Saving old image..."
            OLD_IMAGE=$(docker inspect laravel_docker_app --format='{{.Config.Image}}' || true)

            echo "Deploying new version..."
            docker compose pull
            docker compose up -d --remove-orphans

            echo "Waiting for app..."
            sleep 25

            echo "Running health check..."
            if curl -f http://localhost:8001; then
                echo "Deployment successful"

                docker compose exec -T app php artisan migrate --force
                docker compose exec -T app php artisan optimize:clear
                docker compose exec -T app php artisan optimize

            else
                echo "Health check failed"

                if [ -n "$OLD_IMAGE" ]; then
                    echo "Rolling back..."

                    docker compose down

                    docker pull $OLD_IMAGE

                    docker run -d \
                      --name laravel_docker_app \
                      --network laravel-docker \
                      $OLD_IMAGE

                    docker run -d \
                      --name laravel_docker_nginx \
                      --network laravel-docker \
                      -p 8001:80 \
                      -v /var/www/laravel-docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro \
                      nginx:alpine

                    echo "Rollback complete"
                    exit 1
                else
                    echo "No previous image found"
                    exit 1
                fi
            fi

            echo "Cleaning old images..."
            docker image prune -f

          EOF