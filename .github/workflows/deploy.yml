name: Laravel CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/laravel_docker_app:latest
            ${{ secrets.DOCKER_USERNAME }}/laravel_docker_app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << EOF
            set -e
            cd /var/www/laravel-docker

            echo "Pull latest image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/laravel_docker_app:latest

            echo "Restart containers..."
            docker compose down
            docker compose up -d

            echo "Wait for DB..."
            sleep 30

            echo "Laravel commands..."
            docker exec -i laravel_docker_app php artisan migrate --force
            docker exec -i laravel_docker_app php artisan optimize:clear
            docker exec -i laravel_docker_app php artisan optimize

            echo "Health check..."
            curl -f http://localhost:8001

            echo "Deployment successful"

            docker image prune -f
          EOF