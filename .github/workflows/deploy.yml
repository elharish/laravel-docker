name: Laravel CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/laravel_docker_app:latest
            ${{ secrets.DOCKER_USERNAME }}/laravel_docker_app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with Rollback
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd /var/www/laravel-docker

            echo "Saving current image..."
            OLD_IMAGE=$(docker inspect laravel_docker_app --format='{{.Config.Image}}' || true)

            rollback() {
              echo "Deployment failed. Rolling back..."

              if [ -n "$OLD_IMAGE" ]; then
                echo "Restoring old image in docker-compose..."

                sed -i "s|image: .*|image: $OLD_IMAGE|" docker-compose.yml

                docker compose pull
                docker compose up -d --remove-orphans

                echo "Rollback complete"
              else
                echo "No previous image found"
              fi

              exit 1
            }

            echo "Updating docker-compose to new image..."
            sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/laravel_docker_app:${{ github.sha }}|" docker-compose.yml

            echo "Deploying new version..."
            docker compose pull || rollback
            docker compose up -d --remove-orphans || rollback

            echo "Running Laravel commands..."
            docker compose exec -T app php artisan migrate --force || rollback
            docker compose exec -T app php artisan optimize:clear || rollback
            docker compose exec -T app php artisan optimize || rollback

            echo "Waiting for app..."
            sleep 25

            echo "Running health check..."
            curl -f http://localhost:8001 || rollback

            echo "Deployment successful"

            echo "Cleaning old images..."
            docker image prune -f
          EOF