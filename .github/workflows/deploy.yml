name: Laravel CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/laravel_docker_app:latest
            ${{ secrets.DOCKER_USERNAME }}/laravel_docker_app:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with Rollback
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << EOF
            set -e
            cd /var/www/laravel-docker

            OLD_IMAGE=\$(docker inspect laravel_docker_app --format='{{.Config.Image}}' || true)
            NEW_IMAGE=${{ secrets.DOCKER_USERNAME }}/laravel_docker_app:${{ github.sha }}

            rollback() {
              echo "Deployment failed. Rolling back..."

              if [ -n "\$OLD_IMAGE" ]; then
                docker pull "\$OLD_IMAGE"

                sed -i "s|image: .*|image: \$OLD_IMAGE|" docker-compose.yml

                docker compose up -d --no-deps --force-recreate app

                echo "Rollback complete"
              else
                echo "No old image found"
              fi

              exit 1
            }

            echo "Pulling new image..."
            docker pull \$NEW_IMAGE || rollback

            echo "Updating docker-compose..."
            sed -i "s|image: .*|image: \$NEW_IMAGE|" docker-compose.yml

            echo "Restarting app..."
            docker compose up -d --no-deps --force-recreate app || rollback

            echo "Waiting for app..."
            sleep 20

            echo "Running Laravel commands..."
            docker compose exec -T app php artisan migrate --force || rollback
            docker compose exec -T app php artisan optimize:clear || rollback
            docker compose exec -T app php artisan optimize || rollback

            echo "Health check..."
            STATUS=\$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001)

            echo "HTTP Status: \$STATUS"

            if [ "\$STATUS" != "200" ]; then
              rollback
            fi

            echo "Deployment successful"

            docker image prune -f
          EOF