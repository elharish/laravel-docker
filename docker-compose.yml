services:
  app:
    image: elharish/laravel_docker_app:latest
    container_name: laravel_docker_app
    restart: always
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/.env
      - laravel_app:/var/www
    depends_on:
      db:
        condition: service_healthy       # ← wait for healthy, not just started
    networks:
      - laravel-docker

  nginx:
    image: nginx:latest
    container_name: laravel_docker_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - laravel_app:/var/www
    depends_on:
      - app
    networks:
      - laravel-docker

  db:
    image: mysql:8.0
    container_name: laravel_docker_db
    restart: always
    environment:
      MYSQL_DATABASE: laravel_docker
      MYSQL_ROOT_PASSWORD: profiledb
      MYSQL_USER: admin
      MYSQL_PASSWORD: profiledb
    healthcheck:                         # ← add this whole block
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pprofiledb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s                  # give MySQL time to initialize
    networks:
      - laravel-docker

networks:
  laravel-docker:

volumes:
  laravel_app: