services:
  app:
    image: elharish/laravel_docker_app:latest
    container_name: laravel_docker_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - laravel_storage:/var/www/storage
      - laravel_public:/var/www/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel-docker

  nginx:
    image: nginx:alpine
    container_name: laravel_docker_nginx
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - laravel_storage:/var/www/storage
      - laravel_public:/var/www/public
    depends_on:
      - app
    networks:
      - laravel-docker

  db:
    image: mysql:8.0
    container_name: laravel_docker_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: docker
      MYSQL_ROOT_PASSWORD: elharish
      MYSQL_USER: admin
      MYSQL_PASSWORD: elharish
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -pelharish || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 40
      start_period: 180s
    networks:
      - laravel-docker

networks:
  laravel-docker:
    driver: bridge

volumes:
  laravel_storage:
  laravel_public:
  db_data: