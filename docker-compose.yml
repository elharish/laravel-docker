version: "3.8"

services:

  app:
    build: .
    container_name: laravel_docker_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - laravel-docker

  nginx:
    image: nginx:latest
    container_name: laravel_docker_nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel-docker

  db:
    image: mysql:8.0
    container_name: laravel_docker_db
    restart: always
    environment:
      MYSQL_DATABASE: laravel_docker
      MYSQL_ROOT_PASSWORD: profiledb
      MYSQL_USER: admin
      MYSQL_PASSWORD: profiledb
    ports:
      - "3306:3306"
    networks:
      - laravel-docker

networks:
  laravel-docker: