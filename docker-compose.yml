services:
  app:
    image: elharish/laravel_docker_app:latest
    container_name: laravel_docker_app
    restart: always
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/.env
      - laravel_app:/var/www          # ← share app files via named volume
    networks:
      - laravel-docker

  nginx:
    image: nginx:latest
    container_name: laravel_docker_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - laravel_app:/var/www          # ← same named volume, NOT ./:/var/www
    depends_on:
      - app
    networks:
      - laravel-docker

  db:
    image: mysql:8.0
    container_name: laravel_docker_db
    restart: always
    environment:
      MYSQL_DATABASE: laravel_docker
      MYSQL_ROOT_PASSWORD: profiledb
      MYSQL_USER: admin
      MYSQL_PASSWORD: profiledb
    networks:
      - laravel-docker

networks:
  laravel-docker:

volumes:
  laravel_app: